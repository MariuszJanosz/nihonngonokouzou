[project]

name = "nihonngonokouzou"
version = "0.1.0"
description = "Japanese language map"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]",
    "sqlalchemy",
    "fastapi[standard]",
]

[project.optional-dependencies]

dev = [
    "requests",
]
dev-tools = [
    "ruff",
    "pytest",
    "mypy",
    "pytest-cov",
    "pre-commit",
    "pip-audit",
    "bandit",
    "alembic",
]

[tool.setuptools.packages.find]
include = []

[tool.ruff]

line-length = 80
target-version = "py312"

[tool.pytest.ini_options]

pythonpath = ["."]

[tool.mypy]

python_version = "3.12"
pretty = true
show_error_codes = true
warn_unreachable = true
extra_checks = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
explicit_package_bases = true

[tool.coverage.run]

source = ["scripts"]
branch = true
omit = [
    "tests/*",
    "scripts/get_words_urls.py",
    "scripts/get_dictionary_entry.py",
    "scripts/dictionary_entries_remove_images.py",
    "scripts/format_dictionary_entry.py",
    "scripts/format_words_urls.py",
    "scripts/clean_dictionary_entries.py",
    "scripts/populate_db_dictionary_entry_table.py",
]

[tool.coverage.report]

show_missing = true
skip_covered = true
skip_empty = true
fail_under = 90
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.bandit]

exclude_dirs = [
    ".venv",
    "tests",
]

[tool.fastapi]

entrypoint = "main:app"
